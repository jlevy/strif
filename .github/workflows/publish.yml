name: Publish to PyPI

# Triggered by pushing a `v*` tag. The workflow uploads to PyPI via trusted
# publishing and then creates a GitHub Release with auto-generated notes.
# An agent (or human) just needs to push a tag — no separate release step.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # Enable manual trigger from the Actions UI.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Mandatory for OIDC (PyPI trusted publishing).
      contents: write   # Required for creating the GitHub Release.
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Important for versioning plugins:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.10.2"
          enable-cache: true
          python-version: "3.12"

      - name: Set up Python (using uv)
        run: uv python install

      - name: Install all dependencies
        run: uv sync --all-extras

      - name: Run tests
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
        # Although uv is newer and faster, the "official" publishing option is the one from PyPA,
        # which uses twine. If desired, replace `uv publish` with:
        # uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        # Pinned to commit SHA because this is a single-maintainer third-party action
        # that runs alongside a publish step with write permissions. Update the SHA
        # together with the version comment when bumping.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
